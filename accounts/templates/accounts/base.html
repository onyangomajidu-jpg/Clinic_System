<!DOCTYPE html>
{# All styling is inline/self-contained (no CDN) so the login and
   dashboard screens keep working with no internet connection, per the
   SDD's offline-first design goal. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinic System{% endblock %}</title>
  <!-- PWA (FR-12): enables offline use and install as a native app -->
  <link rel="manifest" href="{% url 'core:pwa_manifest' %}">
  <meta name="theme-color" content="#0f6e5c">
  <link rel="icon" href="/static/pwa/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/pwa/icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(error => {
          console.log('Service worker registration failed:', error);
        });
      });
    }
  </script>
  <style>
    :root {
      --brand: #0f6e5c;
      --brand-dark: #0b5346;
      --brand-light: #e6f2ef;
      --ink: #1f2933;
      --muted: #52606d;
      --border: #d9e2ec;
      --bg: #f4f7f6;
      --error: #b3261e;
      --error-bg: #fbeae9;
      --success: #1e7e34;
      --success-bg: #e6f4ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 17px;
    }
    header.topbar {
      background: var(--brand);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header.topbar .brand { font-weight: 600; font-size: 1.1rem; }
    header.topbar form { margin: 0; }
    header.topbar button {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .topbar-link {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .topbar-link:hover { background: rgba(255, 255, 255, 0.15); }
    main { padding: 24px 20px; max-width: 900px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
    }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input.input, select.input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }
    input.input:focus, select.input:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    button.primary {
      margin-top: 20px;
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { background: var(--brand-dark); }
    .btn-primary {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary {
      display: inline-block;
      background: #fff;
      color: var(--brand);
      border: 1px solid var(--brand);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-secondary:hover { background: var(--brand-light); }
    .btn-small {
      display: inline-block;
      background: var(--brand-light);
      color: var(--brand-dark);
      border: 1px solid var(--brand);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-small:hover { background: var(--brand); color: #fff; }
    .error {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: 0.95rem;
    }
    .success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 14px;
      font-size: 0.95rem;
    }
    .muted { color: var(--muted); }
    .hint { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .field-error { display: block; color: var(--error); font-size: 0.85rem; margin-top: 4px; }
    ul.errorlist { list-style: none; padding: 0; margin: 0; color: var(--error); font-size: 0.9rem; }

    /* Two-column form grid for faster data entry on desktop, single column on small screens */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 20px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
    .field { min-width: 0; }

    /* Dashboard menu cards */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }
    .menu-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      text-decoration: none;
      color: var(--ink);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .menu-card:hover {
      border-color: var(--brand);
      box-shadow: 0 2px 8px rgba(15, 110, 92, 0.12);
    }
    .menu-card strong { font-size: 1.05rem; color: var(--brand-dark); }
    .menu-card .muted { font-size: 0.9rem; }

    /* Search form */
    .search-form {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .search-form .input { flex: 1; }

    /* Results table */
    .table-wrap { overflow-x: auto; margin-top: 18px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:hover td { background: var(--brand-light); }
    td.actions { text-align: right; white-space: nowrap; }
    td.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 0.9rem; }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    /* Patient card (printable) */
    .patient-card { max-width: 640px; margin: 0 auto; }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid var(--brand);
      padding-bottom: 14px;
    }
    .card-no { text-align: right; }
    .card-no strong { font-size: 1.15rem; color: var(--brand-dark); }
    .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; padding: 18px 0; }
    @media (max-width: 480px) {
      .card-body { grid-template-columns: 1fr; }
    }
    .detail { display: flex; flex-direction: column; gap: 2px; }
    .detail .muted { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .card-foot { display: flex; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 16px; }

    /* Status badges (visit open/closed/referred) */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-open { background: #e8f0fe; color: #1a56db; }
    .badge-closed { background: var(--success-bg); color: var(--success); }
    .badge-referred { background: #fef3c7; color: #92400e; }

    /* Vitals display on visit detail */
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .vital {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .vital .muted { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .vital strong { font-size: 1.05rem; }

    /* Visit history list */
    .visit-list { list-style: none; padding: 0; margin: 18px 0 0; }
    .visit-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .visit-item:last-child { border-bottom: none; }
    .visit-item .visit-main { min-width: 0; flex: 1; }
    .visit-item .visit-date { font-size: 0.85rem; color: var(--muted); }
    .visit-item .visit-dx { margin-top: 4px; font-size: 0.95rem; }
    .visit-item .visit-actions { display: flex; gap: 8px; align-items: center; }

    /* Print: hide navigation and buttons, keep only the card */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      main { padding: 0; max-width: none; }
      .card { border: none; padding: 0; }
      .card-head { border-bottom: 2px solid #000; }
      .card-no strong { color: #000; }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
