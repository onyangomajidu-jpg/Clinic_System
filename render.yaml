# Render Blueprint for the Clinic Management System.
# Deploy with:  render blueprint launch  (or connect this repo and Render
# auto-detects render.yaml).
#
# Creates:
#   - A web service (built from the Dockerfile) that runs gunicorn
#   - A managed PostgreSQL database wired to the app via DATABASE_URL

databases:
  - name: clinic-system-db
    plan: free
    databaseName: clinic_system
    user: clinic_user

services:
  - type: web
    name: clinic-system
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # NOTE: No startCommand here - Render's *docker* runtime runs the Dockerfile's
    # CMD (which already does collectstatic + migrate + gunicorn on $PORT).
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Initial admin login - auto-provisioned on every deploy by
      # `python manage.py create_admin` (see Dockerfile CMD). Change these and
      # re-deploy to rotate the password; keep them out of public repos.
      - key: DJANGO_ADMIN_USERNAME
        value: "admin"
      - key: DJANGO_ADMIN_EMAIL
        value: "admin@example.com"
      - key: DJANGO_ADMIN_PASSWORD
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "true"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-system-db
          property: connectionString
